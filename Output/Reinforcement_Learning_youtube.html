<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reinforcement_Learning_youtube</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            background-color: #fff;
            color: #000;
        }

        .responsive {
            width: 100%;
            height: auto;
            max-width: 300px;
        }

        /* Add a hover effect (blue shadow) */
        img:hover {
            box-shadow: 0 0 4px 2px rgb(255, 230, 0);
        }

        .container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            grid-gap: 0.75rem;
            gap: 0.75rem;
            padding: 0.75rem;
            background-color: #7fa7c5;
            color: #fff;
        }

    </style>

</head>

<body>
    <div id="ytplayer" class="container"></div>

    <script>
        list = [
            "0eKg1LBsEKc",
"nMnsk3Tgwg4",
"YzBRLQbOl_I",
"dyt42j7XJaQ",
"uePeleYXD-0",
"Q86qzJ1K1Ss",
"Cn6F1wAhjyo",
"NxAn0oglMVw",
"SaRQJei3g0o"           
        ]
        titles = [
            "Episode 3 - SARSA et Q-Learning",
"Real Numbers, ordered field axioms (*Calculus I*, by T. Apostol)",
"The 6 Tables Every Login System Needs",
"Artificial Intelligence - Past, Present, Future: Prof. W. Eric Grimson",
"Q-Learning em Python com Gym",
"Stanford CME295 Transformers & LLMs | Autumn 2025 | Lecture 9 - Recap & Current Trends",
"Mathe-News! 🚨 Navier-Stokes wurde gelöst!",
"Sparse Identification of Nonlinear Dynamics (SINDy): Sparse Machine Learning Models 5 Years Later!",
"48. Taxi Project using Reinforcement Learning || End to End AI Tutorial"           
        ]

        s = list.map((x) => {
            return `
                <div>
                    <a href="https://www.youtube.com/watch?v=${x}" target="_blank">
                        <img src="https://i.ytimg.com/vi/${x}/hqdefault.jpg" class="responsive">
                    </a><br/>
                    <p>${titles[list.indexOf(x)]}</p>
                </div>
            `;
        });

        ytplayer = document.getElementById("ytplayer");
        s.forEach((x) => {
            ytplayer.innerHTML += x;
        });

    </script>
</body>

</html>
